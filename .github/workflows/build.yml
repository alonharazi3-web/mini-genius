name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm install -g cordova
      - run: npm install
      - name: Use consistent signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - run: cordova platform add android || true
      - run: cordova prepare android
      - name: Install custom notification plugin manually
        run: |
          # Copy Java source directly into the Android project
          mkdir -p platforms/android/app/src/main/java/com/recruit/minigenius
          cp plugins/cordova-plugin-mg-notification/src/android/MGNotification.java \
             platforms/android/app/src/main/java/com/recruit/minigenius/

          # Add POST_NOTIFICATIONS permission to AndroidManifest
          if ! grep -q "POST_NOTIFICATIONS" platforms/android/app/src/main/AndroidManifest.xml; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' \
              platforms/android/app/src/main/AndroidManifest.xml
          fi

          # Verify feature is in platform config.xml (copied from root by cordova prepare)
          grep "MGNotification" platforms/android/app/src/main/res/xml/config.xml && echo "✅ Feature registered" || echo "❌ Feature missing!"

          # Add intent-filter for receiving shared text from WhatsApp
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.intent.action.SEND" "$MANIFEST"; then
            sed -i '/<\/activity>/i \        <intent-filter>\n            <action android:name="android.intent.action.SEND" \/>\n            <category android:name="android.intent.category.DEFAULT" \/>\n            <data android:mimeType="text\/plain" \/>\n        <\/intent-filter>\n        <intent-filter>\n            <action android:name="android.intent.action.SEND" \/>\n            <category android:name="android.intent.category.DEFAULT" \/>\n            <data android:mimeType="text\/*" \/>\n        <\/intent-filter>' "$MANIFEST"
            echo "✅ Intent filter added"
          fi

          echo "✅ Plugin installed"
      - run: cordova compile android --debug
      - name: Find and copy APK
        run: |
          echo "=== All APKs ==="
          find platforms/android -name "*.apk" -type f
          APK=$(find platforms/android -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK found!"; exit 1; fi
          echo "Using: $APK"
          cp "$APK" "mini-genius.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mini-genius
          path: mini-genius.apk
          retention-days: 90
