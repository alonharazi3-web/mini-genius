name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm install -g cordova
      - run: npm install
      - name: Use consistent signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - run: cordova platform add android || true
      - name: Install custom notification plugin
        run: cordova plugin add $GITHUB_WORKSPACE/plugins/cordova-plugin-mg-notification
      - run: cordova build android --debug
      - name: Find and copy APK
        run: |
          echo "=== All APKs ==="
          find platforms/android -name "*.apk" -type f
          APK=$(find platforms/android -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK found!"; exit 1; fi
          echo "Using: $APK"
          cp "$APK" "mini-genius.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mini-genius
          path: mini-genius.apk
          retention-days: 90
