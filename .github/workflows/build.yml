name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm install -g cordova
      - run: npm install
      - name: Use consistent signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - run: cordova platform add android || true
      - name: Install custom notification plugin manually
        run: |
          # Copy Java source directly into the Android project
          mkdir -p platforms/android/app/src/main/java/com/recruit/minigenius
          cp plugins/cordova-plugin-mg-notification/src/android/MGNotification.java \
             platforms/android/app/src/main/java/com/recruit/minigenius/

          # Add feature to Android config
          if ! grep -q "MGNotification" platforms/android/app/src/main/res/xml/config.xml; then
            sed -i '/<\/widget>/i \    <feature name="MGNotification"><param name="android-package" value="com.recruit.minigenius.MGNotification"/></feature>' \
              platforms/android/app/src/main/res/xml/config.xml
          fi

          # Add permission to AndroidManifest
          if ! grep -q "POST_NOTIFICATIONS" platforms/android/app/src/main/AndroidManifest.xml; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' \
              platforms/android/app/src/main/AndroidManifest.xml
          fi

          # Ensure androidx.core dependency for NotificationCompat
          if ! grep -q "androidx.core:core" platforms/android/app/build.gradle; then
            sed -i '/dependencies {/a \    implementation "androidx.core:core:1.12.0"' \
              platforms/android/app/build.gradle
          fi

          echo "✅ Plugin installed manually"
      - run: cordova build android --debug
      - name: Find and copy APK
        run: |
          echo "=== All APKs ==="
          find platforms/android -name "*.apk" -type f
          APK=$(find platforms/android -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK found!"; exit 1; fi
          echo "Using: $APK"
          cp "$APK" "mini-genius.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mini-genius
          path: mini-genius.apk
          retention-days: 90
