<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Genius — אימות</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;direction:rtl;background:#EEF2F7;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:16px;padding:30px;max-width:400px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}
h1{color:#1B2A4A;font-size:1.3rem;margin-bottom:12px}
.icon{font-size:3rem;margin-bottom:16px}
.token-box{background:#f0f0f0;border:2px solid #ddd;border-radius:8px;padding:12px;word-break:break-all;font-family:monospace;font-size:.75rem;direction:ltr;text-align:left;margin:16px 0;max-height:80px;overflow-y:auto;cursor:pointer}
.token-box.copied{border-color:#2ECC71;background:#f0fdf4}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px}
.btn-primary{background:#4A90D9;color:#fff}
.btn-success{background:#2ECC71;color:#fff}
.info{color:#7F8C8D;font-size:.85rem;margin-top:16px;line-height:1.6}
.error{color:#E74C3C;margin:16px 0}
</style>
</head>
<body>
<div class="card" id="content">
<div class="icon">⏳</div>
<h1>מעבד אימות...</h1>
</div>

<script>
(function(){
  var card=document.getElementById('content');

  // Authorization code flow: code comes as query parameter ?code=...
  var urlParams=new URLSearchParams(window.location.search);
  var code=urlParams.get('code');
  var error=urlParams.get('error');

  // Fallback: check hash for old implicit flow #access_token=...
  var hash=window.location.hash.substring(1);
  var hashParams={};
  hash.split('&').forEach(function(p){var kv=p.split('=');if(kv[0])hashParams[kv[0]]=decodeURIComponent(kv[1]||'');});

  if(code){
    // Authorization code flow — show code for user to copy
    card.innerHTML='<div class="icon">✅</div>'
    +'<h1>אימות הצליח!</h1>'
    +'<div style="font-size:.88rem;margin:12px 0;line-height:1.8;">1. לחץ על הקוד כדי להעתיק<br>2. חזור ל-Mini Genius<br>3. הדבק בשדה קוד האימות</div>'
    +'<div class="token-box" id="codeBox" onclick="copyCode()">'+code+'</div>'
    +'<button class="btn btn-primary" id="copyBtn" onclick="copyCode()">📋 העתק קוד אימות</button>'
    +'<div class="info">חזור ל-Mini Genius והדבק את הקוד.<br>החיבור יהיה <strong>קבוע</strong> — לא תצטרך לחזור על זה שוב!</div>';

    window.copyCode=function(){
      var box=document.getElementById('codeBox');
      var btn=document.getElementById('copyBtn');
      if(navigator.clipboard){
        navigator.clipboard.writeText(code).then(function(){
          box.classList.add('copied');
          btn.textContent='✅ הועתק!';
          btn.className='btn btn-success';
        });
      }else{
        var ta=document.createElement('textarea');
        ta.value=code;ta.style.position='fixed';ta.style.left='-9999px';
        document.body.appendChild(ta);ta.select();
        document.execCommand('copy');document.body.removeChild(ta);
        box.classList.add('copied');
        btn.textContent='✅ הועתק!';
        btn.className='btn btn-success';
      }
    };
  }else if(hashParams.access_token){
    // Old implicit flow fallback
    var token=hashParams.access_token;
    card.innerHTML='<div class="icon">✅</div>'
    +'<h1>אימות הצליח!</h1>'
    +'<div class="token-box" id="tokenBox" onclick="copyToken()">'+token+'</div>'
    +'<button class="btn btn-primary" id="copyBtn2" onclick="copyToken()">📋 העתק טוקן</button>'
    +'<div class="info">⚠️ טוקן זמני (שעה). מומלץ לעבור ל-authorization code flow.</div>';
    window.copyToken=function(){
      if(navigator.clipboard)navigator.clipboard.writeText(token);
      document.getElementById('tokenBox').classList.add('copied');
      document.getElementById('copyBtn2').textContent='✅ הועתק!';
    };
  }else if(error){
    card.innerHTML='<div class="icon">❌</div>'
    +'<h1>אימות נכשל</h1>'
    +'<div class="error">'+(urlParams.get('error_description')||error)+'</div>'
    +'<div class="info">נסה שוב מהאפליקציה</div>';
  }else{
    card.innerHTML='<div class="icon">❓</div>'
    +'<h1>לא נמצא קוד אימות</h1>'
    +'<div class="info">נסה שוב מהאפליקציה — לחץ "התחבר ל-Google Drive"</div>';
  }
})();
</script>
</body>
</html>
